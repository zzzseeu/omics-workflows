schema_version: 1
samples_table: samples.tsv
readsets_table: readsets.tsv

defaults:
  assembly:
    backend: hifiasm
    mode: hifi_only
    representation: primary_alternate
    threads: 8
    mem_mb: 64000
    bloom_filter_bits: 37
    purge_level: null
  genome_profile:
    enabled: false
  scaffolding:
    enabled: false
  finishing:
    enabled: false
    gap_closing: false
    telomere_completion: false
  polishing:
    enabled: false
  assessment:
    busco: false
    kmer: false
    read_mapping: false

analysis_profiles:
  hifi_contigs: {}

samples:
  sample_A:
    ploidy: 2
    genome_size_bp: null
    chromosomes_per_haplotype: null
  sample_B:
    ploidy: null
