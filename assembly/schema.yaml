$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [schema_version, samples_table, readsets_table]
properties:
  schema_version: {const: 1}
  samples_table: {type: string, minLength: 1}
  readsets_table: {type: string, minLength: 1}
  prepared_input_cache: {type: [string, 'null']}
  defaults: {$ref: '#/$defs/settings'}
  analysis_profiles:
    type: object
    additionalProperties: {$ref: '#/$defs/settings'}
  samples:
    type: object
    additionalProperties: {$ref: '#/$defs/settings'}
$defs:
  settings:
    type: object
    additionalProperties: false
    properties:
      ploidy: {type: [integer, 'null'], minimum: 1}
      genome_size_bp: {type: [integer, 'null'], minimum: 1}
      chromosomes_per_haplotype: {type: [integer, 'null'], minimum: 1}
      assembly:
        type: object
        additionalProperties: false
        properties:
          backend: {const: hifiasm}
          mode: {enum: [hifi_only, hifi_ul, hifi_hic, hifi_ul_hic, ont_only, ont_hic]}
          representation: {enum: [primary_alternate, phased, unitigs]}
          threads: {type: integer, minimum: 1}
          mem_mb: {type: integer, minimum: 512}
          bloom_filter_bits: {type: integer, minimum: 0, maximum: 39}
          purge_level: {type: [integer, 'null'], minimum: 0, maximum: 3}
      genome_profile: {$ref: '#/$defs/switch'}
      scaffolding:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          backend: {enum: [haphic, gphase]}
          threads: {type: integer, minimum: 4}
          mem_mb: {type: integer, minimum: 1024}
          processes: {type: integer, minimum: 1}
          restriction_sites: {type: string, pattern: '^[ACGTN]+(,[ACGTN]+)*$'}
          enzyme_provenance: {type: string, minLength: 1}
          correct_nrounds: {type: integer, minimum: 0, maximum: 10}
          gap_size: {type: integer, minimum: 1}
          mapq: {type: integer, minimum: 0, maximum: 60}
          nm_exclusive: {type: integer, minimum: 1}
          hic_reference: {enum: [combined, per_haplotype]}
          min_retained_fraction: {type: number, minimum: 0, maximum: 1}
          plot_bin_kb: {type: integer, minimum: 1}
          review_agp: {type: [string, 'null']}
          review_manifest: {type: [string, 'null']}
      finishing:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          gap_closing: {type: boolean}
          telomere_completion: {type: boolean}
          source_delivery: {type: [string, 'null']}
          telomere_motif: {type: [string, 'null'], pattern: '^[ACGT]{2,20}$'}
          threads: {type: integer, minimum: 4}
          mem_mb: {type: integer, minimum: 1024}
          min_anchor: {type: integer, minimum: 500}
          min_identity: {type: number, minimum: 0.95, maximum: 1}
          min_mapq: {type: integer, minimum: 20, maximum: 60}
          min_support: {type: integer, minimum: 2}
          local_window: {type: integer, minimum: 1000}
          max_span: {type: integer, minimum: 1000}
      polishing:
        type: object
        additionalProperties: false
        properties:
          enabled: {type: boolean}
          backend: {const: nextpolish2}
          min_contig_length: {type: integer, minimum: 1000}
          on_missing_wgs: {enum: [skip, error]}
          threads: {type: integer, minimum: 4}
          mem_mb: {type: integer, minimum: 1024}
      assessment:
        type: object
        additionalProperties: false
        properties:
          busco: {type: boolean}
          kmer: {type: boolean}
          read_mapping: {type: boolean}
          busco_lineage: {type: [string, 'null']}
          threads: {type: integer, minimum: 4}
          mem_mb: {type: integer, minimum: 1024}
          min_qv: {type: number, minimum: 0}
          min_busco_complete: {type: number, minimum: 0, maximum: 100}
          terminal_window: {type: integer, minimum: 100}
          terminal_max_distance: {type: integer, minimum: 0}
          terminal_min_repeats: {type: integer, minimum: 3}
  switch:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
