# 当前组装模块的可选依赖参考；不同流程可使用各自的环境，运行时不读取本文件。
# 组装工具和部署要求见 docs/workflows/assembly.md；通用环境选择见 docs/environment.md。
name: omics_workflows
channels:
- https://conda.anaconda.org/conda-forge
- https://conda.anaconda.org/bioconda
dependencies:
- python=3.12
- pip
- snakemake-minimal>=9,<10
- snakemake-executor-plugin-cluster-generic
- hifiasm>=0.25,<1
- samtools>=1.22
- seqkit
- pigz
- gfatools
- minimap2
- yak
- fastp
- busco>=6,<7
- quast>=5,<6
- meryl>=1.4.1
- merqury>=1.4.1
- multiqc
- pyyaml
- bwa
- samblaster
- scipy
- pysam
- scikit-learn
- portion
- sortedcontainers
- boto3
- pyarrow
- snakemake-interface-common=1.23.0
- packaging>=24,<26
- nanoplot>=1.44,<2
- nanofilt=2.8
- hifiadapterfilt=3.0.0
- mosdepth>=0.3
- tidk=0.3.1
- genometools-genometools>=1.6
- ltr_finder_parallel>=1.2
- ltr_retriever>=3,<4
- pylint=3.3.8
